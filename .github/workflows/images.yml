
name: Download JumpServer Images

on:
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and export images
        run: |
          set -e
          docker pull --platform linux/amd64 jumpserver/core:v5.1.1-ce
          docker pull --platform linux/amd64 jumpserver/koko:v5.1.1-ce
          docker pull --platform linux/amd64 jumpserver/chen:v5.1.1-ce
          docker pull --platform linux/amd64 jumpserver/web:v5.1.1-ce

          docker save -o jumpserver-core.tar jumpserver/core:v5.1.1-ce
          docker save -o jumpserver-koko.tar jumpserver/koko:v5.1.1-ce
          docker save -o jumpserver-chen.tar jumpserver/chen:v5.1.1-ce
          docker save -o jumpserver-web.tar jumpserver/web:v5.1.1-ce

          sha256sum *.tar > SHA256SUMS

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: jumpserver-v5.1.1-images
          path: |
            *.tar
            SHA256SUMS
          retention-days: 7
