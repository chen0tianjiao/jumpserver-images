
name: Download Images

on:
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Download and export
        run: |
          docker pull --platform linux/amd64 postgres:16.9
          docker pull --platform linux/amd64 redis:7.4.4
          docker save -o postgres-16.9.tar postgres:16.9
          docker save -o redis-7.4.4.tar redis:7.4.4

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: database-images
          path: "*.tar"
          retention-days: 7
